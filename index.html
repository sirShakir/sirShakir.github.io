<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>sirShakir.github.io</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* =========================================================
   CANVAS
========================================================= */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================================================
   MAIN SCENE
========================================================= */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 1000px;
}

/* =========================================================
   MATRIX LAYER
========================================================= */

#matrix {
    opacity: 0.35;
}

/* =========================================================
   STAR FIELD
========================================================= */

#stars {
    opacity: 0.8;
}

/* =========================================================
   CENTER OBJECT
========================================================= */

.center {
    position: relative;

    transform-style: preserve-3d;

    text-align: center;

    transition:
        transform 0.15s ease-out;
}

/* =========================================================
   GLOWING TITLE
========================================================= */

.title {
    font-size: clamp(45px, 8vw, 110px);

    font-weight: bold;

    color: #00ff9d;

    letter-spacing: 5px;

    text-shadow:
        0 0 5px #00ff9d,
        0 0 15px #00ff9d,
        0 0 35px #00ff9d,
        0 0 70px #00ff9d;

    animation: flicker 4s infinite;

    white-space: nowrap;
}

/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {
    margin-top: 20px;

    color: #7dd3fc;

    font-size: clamp(13px, 2vw, 20px);

    letter-spacing: 6px;

    text-shadow:
        0 0 10px #38bdf8;

    opacity: 0.85;
}

/* =========================================================
   TERMINAL
========================================================= */

.terminal {

    margin: 35px auto 0;

    width: min(600px, 85vw);

    padding: 20px;

    background: rgba(0, 10, 15, 0.75);

    border: 1px solid rgba(0, 255, 157, 0.5);

    box-shadow:
        0 0 20px rgba(0,255,157,0.2),
        inset 0 0 20px rgba(0,255,157,0.05);

    text-align: left;

    backdrop-filter: blur(5px);

    transform: translateZ(50px);
}

.terminal-header {

    display: flex;

    gap: 7px;

    margin-bottom: 15px;
}

.dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #00ff9d;

    box-shadow: 0 0 10px #00ff9d;
}

.command {
    color: #00ff9d;
}

.output {
    color: #94a3b8;

    margin-top: 7px;
}

.cursor {
    display: inline-block;

    width: 8px;
    height: 18px;

    background: #00ff9d;

    vertical-align: middle;

    animation: blink 1s infinite;
}

/* =========================================================
   FLOATING GRID
========================================================= */

.grid {

    position: absolute;

    bottom: -20%;

    left: -20%;

    width: 140%;
    height: 60%;

    background-image:
        linear-gradient(
            rgba(0,255,157,0.15) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,157,0.15) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

    transform:
        perspective(400px)
        rotateX(65deg);

    opacity: 0.35;

    animation: gridMove 5s linear infinite;
}

/* =========================================================
   SCANLINE
========================================================= */

.scanline {

    position: fixed;

    left: 0;

    width: 100%;

    height: 2px;

    background: rgba(0,255,157,0.25);

    box-shadow:
        0 0 10px #00ff9d;

    animation: scan 6s linear infinite;

    pointer-events: none;
}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes flicker {

    0%, 18%, 22%, 63%, 64%, 65%, 100% {
        opacity: 1;
    }

    20%, 62% {
        opacity: 0.65;
    }

}

@keyframes blink {

    0%, 50% {
        opacity: 1;
    }

    51%, 100% {
        opacity: 0;
    }

}

@keyframes scan {

    from {
        top: -5%;
    }

    to {
        top: 105%;
    }

}

@keyframes gridMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 50px;
    }

}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .title {
        letter-spacing: 2px;
    }

    .subtitle {
        letter-spacing: 3px;
    }

    .terminal {
        font-size: 12px;
    }

}
</style>
</head>

<body>

<!-- =======================================================
     BACKGROUND
======================================================= -->

<canvas id="stars"></canvas>
<canvas id="matrix"></canvas>

<div class="grid"></div>

<div class="scanline"></div>


<!-- =======================================================
     MAIN
======================================================= -->

<div class="scene">

    <div class="center" id="center">

        <div class="title">
            sirShakir.github.io
        </div>

        <div class="subtitle">
            DIGITAL SPACE
        </div>

        <div class="terminal">

            <div class="terminal-header">

                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>

            </div>

            <div class="command">
                $ ls
            </div>

            <div class="output">
                sirShakir
            </div>

            <br>

            <div class="command">
                $ cd
            </div>

            <div class="output">
                Systems online...
            </div>

            <div class="output">
                <!-- Studying -->
            </div>

            <br>

            <div class="command">
                $ _
                <span class="cursor"></span>
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   STAR FIELD
========================================================= */

const starCanvas =
    document.getElementById("stars");

const starCtx =
    starCanvas.getContext("2d");

let stars = [];

function resizeStars() {

    starCanvas.width =
        window.innerWidth;

    starCanvas.height =
        window.innerHeight;

    stars = [];

    const amount =
        Math.floor(
            window.innerWidth *
            window.innerHeight /
            7000
        );

    for (let i = 0; i < amount; i++) {

        stars.push({

            x: Math.random() *
                window.innerWidth,

            y: Math.random() *
                window.innerHeight,

            z: Math.random(),

            speed:
                0.1 +
                Math.random() * 0.5

        });

    }

}

function drawStars() {

    starCtx.clearRect(
        0,
        0,
        starCanvas.width,
        starCanvas.height
    );

    for (const star of stars) {

        star.y += star.speed;

        if (
            star.y >
            window.innerHeight
        ) {
            star.y = 0;
            star.x =
                Math.random() *
                window.innerWidth;
        }

        const size =
            0.5 +
            star.z * 2;

        starCtx.beginPath();

        starCtx.arc(
            star.x,
            star.y,
            size,
            0,
            Math.PI * 2
        );

        starCtx.fillStyle =
            `rgba(255,255,255,${star.z})`;

        starCtx.fill();

    }

    requestAnimationFrame(drawStars);

}

resizeStars();
drawStars();

window.addEventListener(
    "resize",
    resizeStars
);


/* =========================================================
   MATRIX RAIN
========================================================= */

const matrixCanvas =
    document.getElementById("matrix");

const matrixCtx =
    matrixCanvas.getContext("2d");

let columns;
let drops;

const characters =
    "01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";

function resizeMatrix() {

    matrixCanvas.width =
        window.innerWidth;

    matrixCanvas.height =
        window.innerHeight;

    columns =
        Math.floor(
            window.innerWidth / 18
        );

    drops =
        Array(columns).fill(0)
            .map(() =>
                Math.random() *
                -100
            );

}

function matrixRain() {

    matrixCtx.fillStyle =
        "rgba(0, 0, 0, 0.06)";

    matrixCtx.fillRect(
        0,
        0,
        matrixCanvas.width,
        matrixCanvas.height
    );

    matrixCtx.font =
        "16px monospace";

    for (
        let i = 0;
        i < columns;
        i++
    ) {

        const char =
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];

        const x =
            i * 18;

        const y =
            drops[i] * 18;

        matrixCtx.fillStyle =
            Math.random() > 0.95
                ? "#ffffff"
                : "#00ff66";

        matrixCtx.fillText(
            char,
            x,
            y
        );

        if (
            y >
            matrixCanvas.height &&
            Math.random() > 0.975
        ) {
            drops[i] = 0;
        }

        drops[i]++;

    }

}

resizeMatrix();

setInterval(
    matrixRain,
    45
);

window.addEventListener(
    "resize",
    resizeMatrix
);


/* =========================================================
   3D MOUSE PARALLAX
========================================================= */

const center =
    document.getElementById("center");

document.addEventListener(
    "mousemove",
    event => {

        const x =
            (event.clientX /
                window.innerWidth -
                0.5);

        const y =
            (event.clientY /
                window.innerHeight -
                0.5);

        const rotateY =
            x * 18;

        const rotateX =
            -y * 18;

        center.style.transform =
            `
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            translateZ(20px)
            `;

    }
);


/* Reset when mouse leaves */

document.addEventListener(
    "mouseleave",
    () => {

        center.style.transform =
            `
            rotateX(0deg)
            rotateY(0deg)
            translateZ(0)
            `;

    }
);

</script>

</body>
</html>
